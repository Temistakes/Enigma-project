repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        files: ^apps/backend/
        args: [--fix, --config=apps/backend/pyproject.toml]
      - id: ruff-format
        files: ^apps/backend/
        args: [--config=apps/backend/pyproject.toml]

  - repo: local
    hooks:
      - id: ty-check
        name: ty check (Astral)
        entry: uv --directory apps/backend run ty check
        language: system
        types: [python]
        files: ^apps/backend/
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv --directory apps/backend run mypy .
        language: system
        types: [python]
        files: ^apps/backend/
        pass_filenames: false
