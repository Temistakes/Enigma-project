[project]
name = "Parch-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-env>=1.7.1",
    "ruff>=0.16.8",
    "ty>=0.0.84",
]

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
]
[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "B008",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
root = ["."]

[tool.ty.rules]
possibly-unresolved-reference = "warn"

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
plugins = [
    "pydantic.mypy",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
env = [
    "MODE=TEST",
]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
